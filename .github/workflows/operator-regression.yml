name: Operator Regression

on:
  push:
    branches:
      - main
      - dev/nmixx-unified
      - "fix/**"
  pull_request:
    branches:
      - main
      - dev/nmixx-unified
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Frontend user flows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Test user operations, parameter state and Scope components
        run: npm run test:all
      - name: Compile Svelte UI and verify types
        run: npm run build

  application:
    name: Rust Application and simulated protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebKit / GTK and serial system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust workspace
        run: cargo test --workspace --locked
